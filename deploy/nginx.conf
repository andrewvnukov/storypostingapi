# /etc/nginx/sites-available/storypostingapi
# Replace example.com with your own domain in all three places.
#
# The legal pages and the TikTok verification file are served straight from the
# repository checkout, so the app's domain and the URLs in the submission match.
# Everything else goes to the app.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot writes its challenge here before issuing the certificate
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # A rendered story is a few MB; a background clip you upload can be far more.
    client_max_body_size 512M;

    # Static pages from the checkout: terms, privacy and the verification file.
    location = /terms.html   { root /srv/storypostingapi; }
    location = /privacy.html { root /srv/storypostingapi; }
    location ~ ^/tiktok[A-Za-z0-9]+\.txt$ { root /srv/storypostingapi; }
    location = /confirm.txt  { root /srv/storypostingapi; }
    location /brand/         { root /srv/storypostingapi; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ffmpeg renders take a while; do not cut the request off mid-render.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
