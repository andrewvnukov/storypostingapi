services:
  app:
    build: ./app
    restart: unless-stopped
    env_file: ./app/.env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
    volumes:
      # The database, the rendered videos and your background clips survive
      # rebuilds; nothing the app writes lives inside the image.
      - ./data:/data
    ports:
      # Bound to loopback: nginx terminates TLS and proxies to it.
      - "127.0.0.1:3000:3000"
